name: Release

# Push a tag such as v0.1.0 to build the Windows installer, test it, and publish it.
# The source repository stays private: the installer is published to a separate, public "releases" repository
# that holds only downloads and release notes (see docs/RELEASING.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO }}
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version -w @mangoai/desktop

      - name: Type-check
        run: npm run typecheck

      - name: Build the runtime (runner, editor, Remotion, Chrome Headless Shell, ffmpeg)
        run: npm run runtime

      - name: Tests (including the ones that need ffmpeg)
        run: npm test

      - name: Build the installer
        run: npm run dist

      - name: Install it silently and run the packaged app's smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\MangoAI-Setup-*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'MangoAI-installed'
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $env:MANGO_PROJECTS_DIR = Join-Path $env:RUNNER_TEMP 'smoke-projects'
          $app = Start-Process -FilePath "$target\MangoAI.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "smoke test failed with exit code $($app.ExitCode)" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release\MangoAI-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "release\SHA256SUMS.txt"
          }
          Get-Content release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MangoAI-windows
          path: |
            release/MangoAI-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to the public releases repository
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASES_REPO != '' && env.HAS_RELEASES_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/MangoAI-Setup-*.exe release/SHA256SUMS.txt \
            --repo "$RELEASES_REPO" \
            --title "MangoAI ${GITHUB_REF_NAME#v}" \
            --notes-file docs/releases-repo/RELEASE_NOTES_TEMPLATE.md \
            --prerelease
