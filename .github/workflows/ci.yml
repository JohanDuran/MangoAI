name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check every package
        run: npm run typecheck
      - name: Build the editor
        run: npm run build -w @mangoai/editor
      # Tests that need the bundled ffmpeg skip themselves here; the release workflow runs them in full.
      - name: Tests
        run: npm test
